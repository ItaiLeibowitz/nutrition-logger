<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Daily Logger</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1411">
<style>
  :root{
    --bg:#0f1411; --card:#19211c; --card2:#212b24; --line:#2c3a30;
    --text:#eaf2ec; --muted:#9bb0a2; --accent:#4caf7d; --accent2:#3a8f64;
    --water:#3da5d9; --warn:#d98b3d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{padding:0 14px 48px; max-width:560px; margin:0 auto;}
  header{position:sticky;top:0;background:linear-gradient(var(--bg),var(--bg) 78%,transparent);
    padding:16px 2px 10px; z-index:5;}
  h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.2px;
    display:flex;align-items:center;justify-content:space-between;}
  .status{font-size:12px;font-weight:600;color:var(--muted);}
  .status.saving{color:var(--warn);} .status.saved{color:var(--accent);}
  .date{color:var(--muted);font-size:13px;margin-top:2px;}
  .banner{background:#2a1f12;border:1px solid #5a3f1c;color:#e7c79a;font-size:13px;
    border-radius:13px;padding:10px 12px;margin:10px 0;line-height:1.45;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px;margin:12px 0;}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:600;
    text-transform:uppercase;letter-spacing:.6px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  button{font-family:inherit;border:none;border-radius:14px;color:var(--text);
    background:var(--card2);padding:14px 16px;font-size:16px;font-weight:600;
    cursor:pointer;flex:1;min-height:54px;transition:transform .05s,background .15s;}
  button:active{transform:scale(.96);}
  .big{font-size:17px;}
  .accent{background:var(--accent2);}
  .accent:active{background:var(--accent);}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--muted);
    flex:0 0 auto;min-height:40px;padding:8px 14px;font-size:14px;font-weight:600;}
  .water-total{font-size:34px;font-weight:720;color:var(--water);}
  .water-sub{color:var(--muted);font-size:13px;margin-top:-2px;}
  .water-btn{background:#143041;color:#cfeaf8;}
  .water-btn:active{background:var(--water);color:#06222f;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .preset{background:var(--card2);font-size:15px;font-weight:600;min-height:50px;}
  .preset:active{background:var(--accent2);}
  input[type=text]{width:100%;background:#0c120e;border:1px solid var(--line);
    color:var(--text);border-radius:13px;padding:14px;font-size:16px;margin-top:10px;}
  .pill{display:flex;align-items:center;gap:12px;background:var(--card2);
    border-radius:13px;padding:13px 14px;margin:8px 0;cursor:pointer;font-size:16px;
    font-weight:600;user-select:none;}
  .pill .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .pill.on{background:#15301f;}
  .pill.on .box{background:var(--accent);border-color:var(--accent);color:#06170e;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .chip{flex:1;min-width:38px;background:var(--card2);border-radius:11px;
    padding:11px 0;text-align:center;font-weight:650;font-size:15px;min-height:46px;
    display:flex;align-items:center;justify-content:center;}
  .chip.on{background:var(--accent);color:#06170e;}
  .sym-label{font-size:13px;color:var(--muted);margin:14px 0 2px;display:flex;
    justify-content:space-between;}
  .loglist{margin-top:14px;}
  .logempty{color:var(--muted);font-size:14px;padding:2px 2px;}
  .logitem{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card2);border-radius:12px;padding:11px 12px;margin:7px 0;font-size:15px;}
  .logitem span{word-break:break-word;}
  .logx{flex:0 0 auto;min-height:0;width:32px;height:32px;padding:0;border-radius:9px;
    background:transparent;color:var(--muted);font-size:21px;line-height:1;font-weight:700;}
  .logx:active{background:#3a2020;color:#ff9b9b;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);
    background:var(--accent);color:#06170e;padding:12px 20px;border-radius:30px;
    font-weight:700;font-size:15px;opacity:0;transition:.25s;z-index:20;
    box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .loading{color:var(--muted);text-align:center;padding:40px 0;}
  .hdr-right{display:flex;align-items:center;gap:10px;}
  .lockbtn{flex:0 0 auto;min-height:0;width:auto;padding:7px 12px;font-size:13px;
    background:var(--card2);color:var(--muted);border-radius:11px;font-weight:600;}
  .lockwrap{display:flex;align-items:center;justify-content:center;min-height:70vh;}
  .lockcard{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:30px 22px;width:100%;max-width:320px;text-align:center;}
  .lockicon{font-size:40px;margin-bottom:6px;}
  .locktitle{font-size:17px;font-weight:650;margin-bottom:18px;}
  #pinInput{width:100%;text-align:center;letter-spacing:8px;font-size:24px;
    background:#0c120e;border:1px solid var(--line);color:var(--text);
    border-radius:13px;padding:14px;margin-bottom:14px;}
  .pinerr{color:#ff9b9b;font-size:14px;min-height:20px;margin-top:12px;}
</style>
</head>
<body>
<header>
  <h1><span>🌱 Daily Logger</span>
    <span class="hdr-right">
      <span class="status" id="status"></span>
      <button id="lockBtn" class="lockbtn" style="display:none">🔒 Lock</button>
    </span>
  </h1>
  <div class="date" id="dateLine">Loading…</div>
</header>

<!-- LOCK SCREEN -->
<div id="lock" class="lockwrap" style="display:none">
  <div class="lockcard">
    <div class="lockicon">🔒</div>
    <div class="locktitle">Enter your PIN</div>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off"
           placeholder="••••" maxlength="12">
    <button class="accent big" id="pinBtn" style="width:100%">Unlock</button>
    <div id="pinErr" class="pinerr"></div>
  </div>
</div>

<div id="app" style="display:none">

  <div class="banner" id="offlineBanner" style="display:none">
    Running in <b>offline mode</b> — entries are saved on this device only.
    Add your database keys to sync across devices.
  </div>

  <!-- WATER -->
  <div class="card">
    <h2>Water</h2>
    <div class="water-total"><span id="waterCupCount">0</span> cups</div>
    <div class="water-sub" id="waterSub">0 L · 0.66 L per cup</div>
    <div class="row" style="margin-top:12px">
      <button class="water-btn big" id="btnCup">+ Cup (660 ml)</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="ghost" id="btnHalf">+ ½ cup</button>
      <button class="ghost" id="btnUndo">– Undo cup</button>
      <button class="ghost" id="btnResetW">Reset</button>
    </div>
  </div>

  <!-- FOOD -->
  <div class="card">
    <h2>Food / Snacks</h2>
    <div class="grid" id="foodPresets"></div>
    <input type="text" id="foodText" placeholder="Type anything you ate…" autocomplete="off">
    <div class="row" style="margin-top:10px">
      <button class="accent big" id="btnLogFood">Log it</button>
    </div>
    <div id="foodLog" class="loglist"></div>
  </div>

  <!-- PILLS -->
  <div class="card">
    <h2>Supplements</h2>
    <div id="pills"></div>
  </div>

  <!-- SYMPTOMS -->
  <div class="card">
    <h2>How's the gut?</h2>
    <div class="sym-label"><span>Bloating</span><span id="bloatVal">—</span></div>
    <div class="seg" id="bloatSeg"></div>
    <div class="sym-label"><span>Stool (Bristol)</span><span id="bristolVal">—</span></div>
    <div class="seg" id="bristolSeg"></div>
    <div class="sym-label"><span>Energy</span><span id="energyVal">—</span></div>
    <div class="seg" id="energySeg"></div>
  </div>

</div>

<div class="loading" id="loading">Loading…</div>
<div class="toast" id="toast"></div>

<script type="module">
/* ============================================================
   CONFIG — Claude fills these in after the Supabase project
   exists. Leave blank to run in on-device (offline) mode.
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: "https://mbzlrnvtyhlkbailbaue.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_RKSSZaQ13JWxvs4BCbVGCg_HaxesGk1"
};

const CUP = 0.66, HALF = 0.33;
const SUPPS = ['Omega-3','Cal-Mag (lunch)','Cal-Mag (dinner)','Psyllium','Creatine','Kiwi'];
const FOOD_PRESETS = ['Sweet potato','Rice','Chicken','Eggs','Protein shake','Kiwi (2)','Banana','Rice cake + PB'];

// Login: your PIN is the account password. PIN_PEPPER is appended only to meet
// the 6-char minimum — it's public, so security rests on the PIN you type.
const LOGIN_EMAIL = "itai.leibowitz@gmail.com";
const PIN_PEPPER  = "food";

/* ---- storage backend: Supabase if configured, else localStorage ---- */
const online = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
let sb = null;
async function initBackend(){
  if(!online) return;
  const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
  sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
}

const Store = {
  async load(date){
    if(sb){
      const { data, error } = await sb.from('daily_log').select('*').eq('date', date).maybeSingle();
      if(error) throw error;
      return data || { date };
    }
    const raw = localStorage.getItem('log:'+date);
    return raw ? JSON.parse(raw) : { date };
  },
  async save(row){
    row.updated_at = new Date().toISOString();
    if(sb){
      const { error } = await sb.from('daily_log').upsert(row, { onConflict:'date' });
      if(error) throw error;
    } else {
      localStorage.setItem('log:'+row.date, JSON.stringify(row));
    }
  }
};

/* ---- helpers ---- */
const $ = id => document.getElementById(id);
function todayStr(){ return new Date().toLocaleDateString('en-CA'); }   // yyyy-mm-dd, local
function nowTime(){ return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false}); }
function prettyDate(){ return new Date().toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'}); }

let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1400); }
function setStatus(s){ const e=$('status'); e.className='status '+s;
  e.textContent = s==='saving' ? 'saving…' : s==='saved' ? 'saved ✓' : s==='error' ? '⚠ not saved' : ''; }

let STATE = null;
let saveTimer = null;

/* Debounced save of the whole day row. */
function persist(){
  setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try { await Store.save(STATE); setStatus('saved'); }
    catch(e){ setStatus('error'); toast('⚠️ '+(e.message||'Save failed')); }
  }, 250);
}

/* ---- food log encoding (string of "[HH:MM] item" joined by " | ") ---- */
function parseLog(str){ str=(str||'').trim(); return str ? str.split(' | ') : []; }
function entriesToStr(arr){ return arr.join(' | '); }

/* ---- boot / auth gate ---- */
(async function boot(){
  $('dateLine').textContent = prettyDate();
  if(!online){ startApp(); return; }                 // on-device mode, no login
  try { await initBackend(); } catch(e){ /* if backend fails, fall back */ }
  if(!sb){ startApp(); return; }
  var sess = null;
  try { sess = (await sb.auth.getSession()).data.session; } catch(e){}
  if(sess) startApp(); else showLock();
})();

function showLock(){
  $('loading').style.display='none';
  $('app').style.display='none';
  $('lock').style.display='flex';
  var inp=$('pinInput'), btn=$('pinBtn');
  btn.onclick=unlock;
  inp.onkeydown=function(e){ if(e.key==='Enter') unlock(); };
  inp.focus();
}
async function unlock(){
  var inp=$('pinInput'), btn=$('pinBtn'); var pin=(inp.value||'').trim();
  if(!pin) return;
  btn.disabled=true; $('pinErr').textContent='';
  try{
    var r = await sb.auth.signInWithPassword({ email: LOGIN_EMAIL, password: pin + PIN_PEPPER });
    if(r.error){ $('pinErr').textContent='Wrong PIN — try again'; inp.value=''; btn.disabled=false; inp.focus(); return; }
  }catch(e){ $('pinErr').textContent='Error: '+(e.message||e); btn.disabled=false; return; }
  btn.disabled=false;
  startApp();
}

async function startApp(){
  try { STATE = await Store.load(todayStr()); }
  catch(e){ $('loading').style.display='block'; $('loading').textContent='Could not load: '+e.message; return; }
  STATE.date = todayStr();
  STATE.water_l = Number(STATE.water_l)||0;
  STATE.food_log = STATE.food_log || '';
  STATE.supps = STATE.supps || '';

  $('lock').style.display='none';
  $('loading').style.display='none';
  $('app').style.display='block';
  if(!online) $('offlineBanner').style.display='block';

  if(sb){
    var lb=$('lockBtn'); lb.style.display='';
    lb.onclick=async function(){ try{ await sb.auth.signOut(); }catch(e){} location.reload(); };
  }

  renderWater();
  renderPresets();
  renderFoodLog();
  renderPills();
  buildSeg('bloatSeg','bloating',0,10,'bloatVal');
  buildSeg('bristolSeg','bristol',1,7,'bristolVal');
  buildSeg('energySeg','energy',1,5,'energyVal');
  wireWater();
  $('btnLogFood').onclick = logFreeFood;
  $('foodText').addEventListener('keydown', e=>{ if(e.key==='Enter') logFreeFood(); });
}

/* ---- water ---- */
const cupsOf = L => Math.round(L/CUP*10)/10;
function renderWater(){
  $('waterCupCount').textContent = cupsOf(STATE.water_l);
  $('waterSub').textContent = (Math.round(STATE.water_l*100)/100)+' L · '+CUP+' L per cup';
}
function addWater(d){
  STATE.water_l = Math.max(0, Math.round((STATE.water_l + d)*100)/100);
  renderWater(); persist(); toast('💧 '+cupsOf(STATE.water_l)+' cups');
}
function wireWater(){
  $('btnCup').onclick  = ()=>addWater(CUP);
  $('btnHalf').onclick = ()=>addWater(HALF);
  $('btnUndo').onclick = ()=>addWater(-CUP);
  $('btnResetW').onclick= ()=>{ STATE.water_l=0; renderWater(); persist(); toast('Water reset'); };
}

/* ---- food ---- */
function renderPresets(){
  const fp=$('foodPresets'); fp.innerHTML='';
  FOOD_PRESETS.forEach(f=>{
    const b=document.createElement('button'); b.className='preset'; b.textContent=f;
    b.onclick=()=>logFood(f); fp.appendChild(b);
  });
}
function renderFoodLog(){
  const c=$('foodLog'); c.innerHTML='';
  const items=parseLog(STATE.food_log);
  if(!items.length){ c.innerHTML='<div class="logempty">Nothing logged yet today.</div>'; return; }
  items.forEach(entry=>{
    const d=document.createElement('div'); d.className='logitem';
    const s=document.createElement('span'); s.textContent=entry;
    const x=document.createElement('button'); x.className='logx'; x.textContent='×'; x.title='Remove';
    x.onclick=()=>removeFood(entry); d.appendChild(s); d.appendChild(x); c.appendChild(d);
  });
}
function logFood(text){
  const items=parseLog(STATE.food_log);
  items.push('['+nowTime()+'] '+text);
  STATE.food_log=entriesToStr(items);
  renderFoodLog(); persist(); toast('🍽️ '+text);
}
function logFreeFood(){
  const i=$('foodText'); const v=(i.value||'').trim();
  if(!v) return; i.value=''; logFood(v);
}
function removeFood(entry){
  const items=parseLog(STATE.food_log);
  const idx=items.indexOf(entry); if(idx>-1) items.splice(idx,1);
  STATE.food_log=entriesToStr(items);
  renderFoodLog(); persist(); toast('Removed');
}

/* ---- supplements (stored as comma-joined string) ---- */
function suppSet(){ return new Set(parseLog(STATE.supps).length ? STATE.supps.split(', ').filter(Boolean) : []); }
function renderPills(){
  const taken=suppSet();
  const pc=$('pills'); pc.innerHTML='';
  SUPPS.forEach(name=>{
    const on=taken.has(name);
    const d=document.createElement('div'); d.className='pill'+(on?' on':'');
    d.innerHTML='<div class="box">'+(on?'✓':'')+'</div>'+name;
    d.onclick=()=>togglePill(name,d); pc.appendChild(d);
  });
}
function togglePill(name,el){
  const taken=suppSet();
  if(taken.has(name)) taken.delete(name); else taken.add(name);
  STATE.supps = SUPPS.filter(s=>taken.has(s)).join(', ');
  const on=taken.has(name);
  el.className='pill'+(on?' on':'');
  el.querySelector('.box').textContent=on?'✓':'';
  persist(); toast(on?'✓ '+name : name+' un-checked');
}

/* ---- symptoms ---- */
function buildSeg(containerId,field,lo,hi,valId){
  const c=$(containerId); c.innerHTML='';
  const valEl=$(valId);
  const cur=STATE[field];
  if(cur!==''&&cur!==null&&cur!==undefined) valEl.textContent=cur;
  for(let n=lo;n<=hi;n++){
    const chip=document.createElement('div');
    chip.className='chip'+(String(cur)===String(n)?' on':'');
    chip.textContent=n;
    chip.onclick=()=>{
      Array.prototype.forEach.call(c.children,x=>x.classList.remove('on'));
      chip.classList.add('on'); valEl.textContent=n;
      STATE[field]=n; persist(); toast(field+': '+n);
    };
    c.appendChild(chip);
  }
}
</script>
</body>
</html>
